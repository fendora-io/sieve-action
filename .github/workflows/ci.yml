name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Validate action.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check action.yml is valid YAML
        run: python3 -c "import yaml, sys; yaml.safe_load(open('action.yml'))" && echo "action.yml is valid"

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install test dependencies
        run: pip install requests

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  sca:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --require-hashes --desc on \
            --ignore-vuln PYSEC-2026-2132 \
            --ignore-vuln PYSEC-2026-3481 \
            --ignore-vuln PYSEC-2026-3482 \
            --ignore-vuln PYSEC-2026-3483 \
            --ignore-vuln PYSEC-2026-3552
