name: Build & Push Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/fendora-io/sieve-action
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Validate image metadata
        env:
          REF_NAME: ${{ github.ref_name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [[ "${REF_NAME}" != "main" && ! "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid ref name: ${REF_NAME}" >&2
            exit 1
          fi
          for tag in ${TAGS}; do
            case "${tag}" in
              ghcr.io/fendora-io/sieve-action:latest|ghcr.io/fendora-io/sieve-action:v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "Invalid image tag: ${tag}" >&2; exit 1 ;;
            esac
          done

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sign:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release metadata
        env:
          REF_NAME: ${{ github.ref_name }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ needs.build.outputs.tags }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${REF_NAME}" >&2
            exit 1
          fi
          if [[ "${REPOSITORY}" != "fendora-io/sieve-action" ]]; then
            echo "Invalid repository: ${REPOSITORY}" >&2
            exit 1
          fi
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid digest: ${DIGEST}" >&2
            exit 1
          fi
          RELEASE_TAGS=""
          for tag in ${TAGS}; do
            case "${tag}" in
              ghcr.io/fendora-io/sieve-action:v[0-9]*.[0-9]*.[0-9]*)
                RELEASE_TAGS="${RELEASE_TAGS} ${tag}"
                ;;
              ghcr.io/fendora-io/sieve-action:latest)
                # Tag pushes may include "latest" in metadata output; never sign/publish it as a release artifact.
                ;;
              *) echo "Invalid image tag: ${tag}" >&2; exit 1 ;;
            esac
          done
          if [[ -z "${RELEASE_TAGS// /}" ]]; then
            echo "No release image tags found in TAGS output" >&2
            exit 1
          fi

      - name: Sign container image
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          for tag in ${TAGS}; do
            case "${tag}" in
              ghcr.io/fendora-io/sieve-action:v[0-9]*.[0-9]*.[0-9]*) ;;
              ghcr.io/fendora-io/sieve-action:latest) continue ;;
              *) continue ;;
            esac
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Generate build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/fendora-io/sieve-action
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true

      - name: Sign and upload release attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.build.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if ! gh release view "${RELEASE_TAG}" --repo "fendora-io/sieve-action" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --repo "fendora-io/sieve-action" --title "${RELEASE_TAG}" --generate-notes
          fi
          echo "${DIGEST}" > image-digest.txt
          cosign sign-blob --yes image-digest.txt --bundle image-digest.sigstore.json
          gh release upload "${RELEASE_TAG}" image-digest.sigstore.json --clobber --repo "fendora-io/sieve-action"

      - name: Upload provenance to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "${BUNDLE}" provenance.intoto.jsonl
          gh release upload "${RELEASE_TAG}" provenance.intoto.jsonl --clobber --repo "fendora-io/sieve-action"

      - name: Generate SBOM
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532 # v0.20.0
        with:
          image: ghcr.io/fendora-io/sieve-action@${{ needs.build.outputs.digest }}
          output-file: sbom.spdx.json

      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "${RELEASE_TAG}" sbom.spdx.json --clobber --repo "fendora-io/sieve-action"
